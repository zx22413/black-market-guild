<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Calm Seas, dark-tide side 「貨滿為患」 (V0.8 prototype; no outlines): an AI-written flat vector placeholder, see
       public/art/SOURCES.md. The crash tide: a dead-flat dark sea, ships queued to the horizon, the quay buried in
       crates nobody buys, a price tag cut down. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101c2a"/><stop offset="0.7" stop-color="#24505a"/><stop offset="1" stop-color="#3f7f80"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b5560"/><stop offset="1" stop-color="#082028"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- a low sun gone pale teal, its light lying on the flat water -->
  <circle cx="92" cy="150" r="46" fill="#58c7c0" opacity="0.16"/><circle cx="92" cy="150" r="26" fill="#b8fff8"/>
  <rect y="160" width="400" height="140" fill="url(#sea)"/>
  <g fill="#b8fff8" opacity="0.55"><rect x="62" y="168" width="60" height="3" rx="1.5"/><rect x="72" y="178" width="40" height="3" rx="1.5"/><rect x="80" y="188" width="24" height="3" rx="1.5"/></g>
  <!-- the queue of ships, sails hanging, each smaller toward the horizon -->
  <g fill="#0b1a22">
    <g transform="translate(150 176) scale(0.26)"><rect x="50" y="-92" width="6" height="92"/><path d="M24 -84 H80 V-34 H24 Z"/><path d="M0 -14 L160 -14 L150 6 Q80 14 14 6 Z"/></g>
    <g transform="translate(206 182) scale(0.36)"><rect x="50" y="-92" width="6" height="92"/><path d="M24 -84 H80 V-34 H24 Z"/><path d="M0 -14 L160 -14 L150 6 Q80 14 14 6 Z"/></g>
  </g>
  <g transform="translate(272 200) scale(0.62)">
    <rect x="50" y="-92" width="5" height="92" fill="#24150f"/><rect x="110" y="-92" width="5" height="92" fill="#24150f"/>
    <path d="M26 -84 H80 Q84 -60 80 -34 H26 Q30 -60 26 -84 Z" fill="#9aa8a4"/><path d="M86 -84 H140 Q144 -60 140 -34 H86 Q90 -60 86 -84 Z" fill="#7f8f8c"/>
    <path d="M0 -14 L160 -14 L150 6 Q80 14 14 6 Z" fill="#4a2a1c"/><path d="M0 -14 L160 -14 L158 -22 L4 -22 Z" fill="#6b3f2a"/>
    <!-- deck cargo it cannot land -->
    <g fill="#8a5a3a"><rect x="20" y="-36" width="22" height="16"/><rect x="46" y="-40" width="22" height="20"/><rect x="92" y="-36" width="22" height="16"/><rect x="118" y="-40" width="22" height="20"/></g>
  </g>
  <!-- the quay, and the heap of crates on it: three values of brown, stacked past the frame -->
  <rect y="246" width="400" height="54" fill="#33241d"/><rect y="246" width="400" height="7" fill="#4f392c"/>
  <g>
    <rect x="-6" y="196" width="56" height="52" fill="#6b4530"/><rect x="-6" y="196" width="56" height="8" fill="#84583c"/>
    <rect x="52" y="208" width="50" height="40" fill="#7a4e32"/><rect x="52" y="208" width="50" height="7" fill="#96663f"/>
    <rect x="104" y="214" width="46" height="34" fill="#6b4530"/><rect x="104" y="214" width="46" height="7" fill="#84583c"/>
    <rect x="14" y="152" width="50" height="44" fill="#7a4e32"/><rect x="14" y="152" width="50" height="7" fill="#96663f"/>
    <rect x="68" y="172" width="44" height="36" fill="#8a5a3a"/><rect x="68" y="172" width="44" height="7" fill="#a8744a"/>
    <rect x="30" y="116" width="42" height="36" fill="#8a5a3a"/><rect x="30" y="116" width="42" height="7" fill="#a8744a"/>
    <g stroke="#3a2418" stroke-width="3"><path d="M22 204 V248 M77 215 V248 M127 221 V248 M39 159 V196 M90 179 V208 M51 123 V152"/></g>
    <!-- one burst open, spice spilling to waste -->
    <path d="M150 248 L160 222 L196 226 L204 248 Z" fill="#6b4530"/><path d="M156 226 L170 212 L200 218 L196 226 Z" fill="#84583c"/>
    <path d="M176 248 Q188 232 206 240 Q222 246 232 248 Z" fill="#c9502f"/><path d="M190 248 Q200 240 214 244 Q224 247 228 248 Z" fill="#e0733f"/>
  </g>
  <!-- the price tag, cut down: the old price struck out in red, an arrow falling, in the tide's teal -->
  <g transform="translate(318 236) rotate(8)">
    <path d="M-52 -34 H40 L60 0 L40 34 H-52 Z" fill="#0c2a34"/><path d="M-48 -30 H38 L55 0 L38 30 H-48 Z" fill="#17505c"/>
    <circle cx="40" cy="0" r="5" fill="#06171d"/>
    <g fill="#b8fff8"><rect x="-38" y="-12" width="12" height="24" rx="2"/><rect x="-20" y="-12" width="12" height="24" rx="2"/><rect x="-2" y="-12" width="12" height="24" rx="2"/></g>
    <path d="M-44 14 L16 -16" stroke="#ff6b5a" stroke-width="5" stroke-linecap="round"/>
  </g>
  <path d="M352 150 V196 M352 196 L338 180 M352 196 L366 180" fill="none" stroke="#7ee6dd" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
