<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 400 300">
  <!-- Diplomat card art: a backlit envoy raising a sealed letter while four figures wait in the arcades, an AI-written flat vector placeholder, see public/art/SOURCES.md. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a3a62"/><stop offset="1" stop-color="#e2a87e"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5e4a5a"/><stop offset="1" stop-color="#2e2232"/></linearGradient>
    <linearGradient id="lamp" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f0b878"/><stop offset="1" stop-color="#9a5a4a"/></linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5"><stop offset="0.55" stop-color="#f8e2c0" stop-opacity="0.55"/><stop offset="1" stop-color="#f8e2c0" stop-opacity="0"/></radialGradient>
    <path id="fig" d="M146 72 Q200 56 254 72 Q200 84 146 72 Z M174 68 Q176 42 200 40 Q224 42 226 68 Z M184 74 Q182 100 200 104 Q218 100 216 74 Z M200 102 Q172 104 162 118 Q150 170 138 270 Q160 282 186 278 L188 290 L206 290 L208 264 L214 264 L216 290 L234 290 L234 252 L240 196 L238 122 Q228 104 200 102 Z M230 112 L262 92 L270 100 L240 132 Z"/>
    <path id="lurk" d="M0 0 Q-14 0 -16 14 L-16 40 L16 40 L16 14 Q14 0 0 0 Z"/>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="196" cy="118" r="128" fill="url(#halo)"/>
  <circle cx="196" cy="118" r="78" fill="#f8e2c0"/>
  <rect y="214" width="400" height="86" fill="url(#ground)"/>
  <!-- the arcades of the harbour office, each arch hiding someone -->
  <g fill="#3a2c44">
    <path d="M0 110 H118 V214 H0 Z"/><path d="M282 110 H400 V214 H282 Z"/>
    <path d="M-4 112 L60 92 L124 112 Z M276 112 L340 92 L404 112 Z"/>
  </g>
  <g fill="url(#lamp)">
    <path d="M12 214 V158 Q12 136 34 136 Q56 136 56 158 V214 Z"/><path d="M66 214 V158 Q66 136 88 136 Q110 136 110 158 V214 Z"/>
    <path d="M290 214 V158 Q290 136 312 136 Q334 136 334 158 V214 Z"/><path d="M344 214 V158 Q344 136 366 136 Q388 136 388 158 V214 Z"/>
  </g>
  <!-- four lurkers, one per role a diplomat can name: shako, tricorn, hood, peaked cap -->
  <g fill="#0e0b14">
    <g transform="translate(34 174)"><use href="#lurk"/><path d="M-9 -2 L-8 -20 L8 -20 L9 -2 Z"/><path d="M-1 -20 Q-4 -28 1 -32 Q4 -26 2 -20 Z" fill="#7a2a26"/></g>
    <g transform="translate(88 174)"><use href="#lurk"/><path d="M-18 -2 Q-8 -2 -4 -10 Q0 -16 4 -10 Q8 -2 18 -2 Q10 4 0 2 Q-10 4 -18 -2 Z"/></g>
    <g transform="translate(312 172)"><path d="M-17 42 Q-20 10 -8 -6 Q0 -14 8 -6 Q20 10 17 42 Z"/></g>
    <g transform="translate(366 174)"><use href="#lurk"/><path d="M-12 -2 Q-4 -10 10 -6 L11 0 L-12 2 Z M6 -2 L16 0 L12 3 Z"/></g>
  </g>
  <use href="#fig" fill="#ffe0b0" transform="translate(-3 -2)"/>
  <use href="#fig" fill="#ffe0b0" transform="translate(3 -2)" opacity="0.6"/>
  <use href="#fig" fill="#2a2030"/>
  <!-- accents: the plume and hat band, the sash of office, the letter with its purple wax seal -->
  <path d="M220 56 Q248 30 276 40 Q252 42 226 64 Z" fill="#8a5ab8"/>
  <path d="M176 64 H224" stroke="#e8b84a" stroke-width="3"/>
  <path d="M168 120 L232 200 L222 206 L162 134 Z" fill="#6a3f92"/>
  <circle cx="230" cy="202" r="4" fill="#e8b84a"/>
  <circle cx="278" cy="84" r="26" fill="#fff3d4" opacity="0.3"/>
  <g transform="rotate(-12 278 84)">
    <rect x="258" y="70" width="42" height="28" rx="2" fill="#efe6d0"/>
    <path d="M258 70 L279 86 L300 70" fill="none" stroke="#c8b898" stroke-width="2"/>
    <circle cx="279" cy="88" r="6.5" fill="#6a3f92"/><circle cx="279" cy="88" r="3" fill="#e8b84a"/>
    <path d="M276 94 L272 106 L278 102 Z M282 94 L286 106 L280 102 Z" fill="#6a3f92"/>
  </g>
</svg>
