<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- The last round without an effect 「最後一回合」 (V0.8 prototype; no outlines): an AI-written flat vector
       placeholder, see public/art/SOURCES.md. The sun going under, the harbour light already lit, one ship coming
       home; an hourglass on the quay with its last sand falling. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#241420"/><stop offset="0.6" stop-color="#9a3a2a"/><stop offset="1" stop-color="#f2b24c"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a3224"/><stop offset="1" stop-color="#24101a"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <g fill="#fff8d2"><circle cx="40" cy="30" r="1.6"/><circle cx="110" cy="48" r="1.2"/><circle cx="330" cy="26" r="1.6"/><circle cx="270" cy="52" r="1.2"/></g>
  <!-- the sun half under the horizon -->
  <circle cx="230" cy="190" r="78" fill="#ffe08a" opacity="0.22"/><path d="M182 190 A48 48 0 0 1 278 190 Z" fill="#fff0b8"/>
  <path d="M-10 110 q50 -22 104 -4 q44 -16 96 4 l-8 10 q-90 -8 -192 2 Z" fill="#6a2a2a" opacity="0.8"/>
  <rect y="190" width="400" height="110" fill="url(#sea)"/>
  <g fill="#ffe08a" opacity="0.7"><rect x="186" y="198" width="88" height="4" rx="2"/><rect x="200" y="210" width="60" height="4" rx="2"/><rect x="212" y="222" width="36" height="4" rx="2"/></g>
  <!-- the harbour light on its rock at the right, lit, its beam across the sky -->
  <path d="M316 190 Q330 168 352 168 H400 V190 Z" fill="#2a140c"/>
  <path d="M356 168 L362 84 H382 L388 168 Z" fill="#f6ead0"/><path d="M372 84 H382 L388 168 H372 Z" fill="#c9b08a"/>
  <path d="M358 140 h28 l1 14 h-30 z M360 108 h24 l1 14 h-26 z" fill="#a3262f"/>
  <rect x="358" y="70" width="28" height="16" fill="#2a140c"/><path d="M354 70 h36 l-18 -18 z" fill="#a3262f"/>
  <rect x="364" y="73" width="16" height="10" fill="#ffe08a"/>
  <path d="M364 78 L120 40 V76 Z" fill="#ffe08a" opacity="0.28"/>
  <!-- the one ship coming home, small and dark on the sun's road -->
  <g transform="translate(96 214) scale(0.5)">
    <rect x="50" y="-92" width="5" height="92" fill="#1c0d0a"/><rect x="110" y="-92" width="5" height="92" fill="#1c0d0a"/>
    <path d="M30 -84 Q66 -60 30 -34 H80 Q106 -60 80 -84 Z" fill="#3a1a1c"/><path d="M90 -84 Q126 -60 90 -34 H140 Q166 -60 140 -84 Z" fill="#3a1a1c"/>
    <path d="M112 -92 v-14 h22 l-6 7 l6 7 h-22 z" fill="#e3b04b"/>
    <path d="M0 -14 L160 -14 L150 6 Q80 14 14 6 Z" fill="#1c0d0a"/>
  </g>
  <!-- the quay, and the hourglass on it: brass ends, the top bulb nearly empty, a thread of sand, the heap below -->
  <rect y="252" width="400" height="48" fill="#2a140c"/><rect y="252" width="400" height="6" fill="#4a2a1c"/>
  <g transform="translate(200 206)">
    <rect x="-38" y="-70" width="76" height="10" rx="3" fill="#e3b04b"/><rect x="-38" y="50" width="76" height="10" rx="3" fill="#b38a22"/>
    <rect x="-34" y="-60" width="5" height="110" fill="#8a6420"/><rect x="29" y="-60" width="5" height="110" fill="#8a6420"/>
    <path d="M-26 -60 H26 Q26 -22 4 -6 V0 Q26 16 26 50 H-26 Q-26 16 -4 0 V-6 Q-26 -22 -26 -60 Z" fill="#f6ead0" opacity="0.5"/>
    <path d="M-10 -24 H10 Q6 -12 2 -8 H-2 Q-6 -12 -10 -24 Z" fill="#e3b04b"/>
    <rect x="-1.2" y="-8" width="2.4" height="40" fill="#e3b04b"/>
    <path d="M-24 50 Q-22 26 0 18 Q22 26 24 50 Z" fill="#e3b04b"/><path d="M0 18 Q22 26 24 50 H0 Z" fill="#b38a22"/>
  </g>
</svg>
