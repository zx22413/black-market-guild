<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- Storm, dark-tide side (V0.8 prototype; no outlines): an AI-written flat vector placeholder, see public/art/SOURCES.md.
       The storm tide: a wall of water curling over the ship, the sea turning under it, teal lightning. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1220"/><stop offset="1" stop-color="#1a3440"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#12414d"/><stop offset="1" stop-color="#06171d"/></linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2f8f93"/><stop offset="1" stop-color="#0f3a45"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <!-- cloud bank in three dark values -->
  <path d="M-10 62 q34 -44 78 -22 q22 -32 66 -10 q34 -22 66 8 q44 -12 56 26 q40 -30 80 -6 q30 -20 74 10 V0 H-10 Z" fill="#162434"/>
  <path d="M-10 62 q70 14 140 2 q70 12 140 -2 q70 12 140 2 V40 H-10 Z" fill="#101a28"/>
  <!-- teal lightning, forked, with its glow -->
  <circle cx="118" cy="96" r="58" fill="#58c7c0" opacity="0.14"/>
  <path d="M124 44 L96 108 L118 108 L84 176 L150 96 L126 96 L148 44 Z" fill="#b8fff8"/>
  <path d="M112 108 L70 150 L92 150 L66 190 L110 144 L94 144 Z" fill="#7ee6dd"/>
  <circle cx="330" cy="70" r="30" fill="#58c7c0" opacity="0.1"/>
  <path d="M334 48 L320 82 L332 82 L316 116 L348 74 L336 74 L346 48 Z" fill="#7ee6dd"/>
  <!-- rain driven sideways -->
  <g stroke="#6fb9bd" stroke-width="2" stroke-linecap="round" opacity="0.55">
    <path d="M30 90 l-22 18 M70 130 l-22 18 M200 70 l-22 18 M250 110 l-22 18 M290 150 l-22 18 M380 110 l-22 18 M180 150 l-22 18 M40 170 l-22 18"/>
  </g>
  <rect y="190" width="400" height="110" fill="url(#sea)"/>
  <!-- the wall of water curling over from the right: body, shaded underside, foam crest -->
  <path d="M400 300 V60 Q330 30 262 62 Q214 86 204 130 Q236 108 268 122 Q230 150 226 196 Q260 232 400 240 Z" fill="url(#wall)"/>
  <path d="M400 240 Q300 236 226 196 Q232 160 268 122 Q286 150 290 190 Q330 214 400 216 Z" fill="#0c2f3a"/>
  <path d="M204 130 Q214 86 262 62 Q330 30 400 60 V76 Q332 50 270 78 Q232 96 220 124 Q212 122 204 130 Z" fill="#e8fffc"/>
  <path d="M204 130 q-10 14 -4 26 q8 -12 20 -14 q-10 -4 -16 -12 z M236 108 q-14 6 -16 20 q10 -8 22 -6 z" fill="#b8fff8"/>
  <!-- the ship under it, heeled hard, sails torn: hull in two browns -->
  <g transform="translate(60 232) rotate(-24)">
    <rect x="50" y="-90" width="5" height="90" fill="#24150f"/><rect x="104" y="-78" width="5" height="78" fill="#24150f"/>
    <path d="M24 -84 Q54 -62 24 -40 H66 L58 -56 L74 -62 L62 -84 Z" fill="#9aa39c"/><path d="M48 -84 Q70 -62 48 -40 H66 L58 -56 L74 -62 L62 -84 Z" fill="#6f7a76"/>
    <path d="M82 -72 Q108 -56 82 -38 H128 Q150 -56 128 -72 Z" fill="#9aa39c"/><path d="M106 -72 Q130 -56 106 -38 H128 Q150 -56 128 -72 Z" fill="#6f7a76"/>
    <path d="M106 -78 v-12 h18 l-5 5 l5 5 h-18 z" fill="#d04a3e"/>
    <path d="M0 -14 L156 -14 L146 6 Q78 14 14 6 Z" fill="#4a2a1c"/><path d="M0 -14 L156 -14 L154 -22 L4 -22 Z" fill="#6b3f2a"/>
  </g>
  <!-- the sea turning: whirl rings round the ship, then the near waves -->
  <g fill="none" stroke="#58c7c0" stroke-linecap="round" opacity="0.7">
    <path d="M20 262 Q110 228 210 262" stroke-width="3"/><path d="M50 280 Q120 256 190 280" stroke-width="2.5"/>
  </g>
  <path d="M0 300 V262 Q40 236 84 258 Q120 276 160 256 Q200 238 240 262 Q290 288 340 262 Q372 246 400 258 V300 Z" fill="#0f3a45"/>
  <path d="M0 300 V282 Q60 264 120 282 Q180 298 240 280 Q300 264 400 284 V300 Z" fill="#06171d"/>
  <path d="M78 258 q10 -12 22 -6 q-8 2 -6 10 z M234 262 q12 -14 24 -4 q-8 2 -8 10 z" fill="#b8fff8"/>
</svg>
