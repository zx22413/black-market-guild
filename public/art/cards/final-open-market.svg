    <g fill="#f2c94c"><circle cx="160" cy="174" r="4"/><circle cx="170" cy="172" r="4"/><circle cx="182" cy="174" r="4"/><circle cx="218" cy="173" r="4"/><circle cx="230" cy="171" r="4"/><circle cx="242" cy="174" r="4"/></g>
  </g>
