  <!-- the lantern string between the posts -->
  <path d="M121 78 Q200 122 279 78" fill="none" stroke="#2a140c" stroke-width="2.5"/>
  <g>
    <circle cx="150" cy="98" r="14" fill="#ffd27a" opacity="0.3"/><rect x="144" y="92" width="12" height="15" rx="3" fill="#ff9a4a"/>
    <circle cx="200" cy="108" r="14" fill="#ffd27a" opacity="0.3"/><rect x="194" y="102" width="12" height="15" rx="3" fill="#ffd27a"/>
    <circle cx="250" cy="98" r="14" fill="#ffd27a" opacity="0.3"/><rect x="244" y="92" width="12" height="15" rx="3" fill="#ff9a4a"/>
