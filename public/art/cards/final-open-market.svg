  <g><ellipse cx="170" cy="262" rx="12" ry="5" fill="#b38a22"/><ellipse cx="170" cy="257" rx="12" ry="5" fill="#f2c94c"/><ellipse cx="170" cy="252" rx="12" ry="5" fill="#ffe08a"/><ellipse cx="206" cy="268" rx="12" ry="5" fill="#f2c94c"/><ellipse cx="236" cy="258" rx="12" ry="5" fill="#b38a22"/><ellipse cx="236" cy="253" rx="12" ry="5" fill="#f2c94c"/></g>
