<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- The last round 「黑市大開」 (V0.8 prototype; no outlines): an AI-written flat vector placeholder, see
       public/art/SOURCES.md. The market thrown open at dusk: the gate's two leaves swung wide, lantern strings, stalls
       heaped with goods, gold on every counter. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a1a22"/><stop offset="0.55" stop-color="#b5482a"/><stop offset="1" stop-color="#f2b24c"/></linearGradient>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6b3a22"/><stop offset="1" stop-color="#2a140c"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="200" cy="170" r="70" fill="#ffe08a" opacity="0.28"/><circle cx="200" cy="170" r="42" fill="#fff0b8"/>
  <!-- the town behind, a dark skyline with lit windows -->
  <path d="M0 190 V150 h30 v-18 h26 v26 h30 v-34 l16 -14 l16 14 v30 h26 V190 Z" fill="#3a1a1c"/>
  <path d="M400 190 V146 h-34 v-22 h-24 v30 h-30 v-30 l-14 -12 l-14 12 v28 h-24 V190 Z" fill="#3a1a1c"/>
  <g fill="#ffd27a"><rect x="40" y="144" width="6" height="8"/><rect x="96" y="138" width="6" height="8"/><rect x="130" y="160" width="6" height="8"/><rect x="352" y="138" width="6" height="8"/><rect x="300" y="150" width="6" height="8"/><rect x="262" y="162" width="6" height="8"/></g>
  <rect y="190" width="400" height="110" fill="url(#ground)"/>
  <!-- the gate: two stone posts with brass caps, its leaves swung wide open to either side -->
  <rect x="108" y="84" width="26" height="130" fill="#4a2a1c"/><rect x="108" y="84" width="8" height="130" fill="#6b3f2a"/><path d="M102 84 h38 l-6 -14 h-26 z" fill="#e0b84a"/>
  <rect x="266" y="84" width="26" height="130" fill="#4a2a1c"/><rect x="266" y="84" width="8" height="130" fill="#6b3f2a"/><path d="M260 84 h38 l-6 -14 h-26 z" fill="#e0b84a"/>
  <path d="M108 100 L56 118 V222 L108 214 Z" fill="#7a4e32"/><path d="M108 100 L56 118 V130 L108 114 Z" fill="#96663f"/><path d="M82 110 V218" stroke="#4a2a1c" stroke-width="4"/>
