<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- The last round 「最後一搏」 (V0.8 prototype; no outlines): an AI-written flat vector placeholder, see
       public/art/SOURCES.md. Two dice thrown across the sunset (each ship rolls two and keeps the higher), a ship
       under full sail running for the sun. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2a1420"/><stop offset="0.6" stop-color="#b5482a"/><stop offset="1" stop-color="#f6c460"/></linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8a3a26"/><stop offset="1" stop-color="#2a1218"/></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)"/>
  <circle cx="130" cy="190" r="84" fill="#ffe08a" opacity="0.25"/><circle cx="130" cy="190" r="52" fill="#fff0b8"/>
  <path d="M-10 96 q40 -20 90 -6 q40 -18 80 2 l-6 10 q-80 -8 -164 4 Z" fill="#7a2f2a" opacity="0.8"/>
  <path d="M230 70 q40 -18 84 -4 q36 -14 96 6 v10 q-90 -10 -180 0 Z" fill="#5a2228" opacity="0.8"/>
  <rect y="190" width="400" height="110" fill="url(#sea)"/>
  <g fill="#ffe08a" opacity="0.75"><rect x="84" y="198" width="92" height="4" rx="2"/><rect x="98" y="210" width="64" height="4" rx="2"/><rect x="110" y="222" width="40" height="4" rx="2"/><rect x="118" y="234" width="24" height="4" rx="2"/></g>
  <!-- the ship running for the sun, a dark shape against it with its sails full -->
  <g transform="translate(74 214) scale(0.72)">
    <rect x="50" y="-98" width="5" height="98" fill="#1c0d0a"/><rect x="110" y="-98" width="5" height="98" fill="#1c0d0a"/>
    <path d="M30 -90 Q70 -64 30 -36 H80 Q110 -64 80 -90 Z" fill="#3a1a1c"/><path d="M90 -90 Q130 -64 90 -36 H140 Q170 -64 140 -90 Z" fill="#3a1a1c"/>
    <path d="M112 -98 v-16 h24 l-6 8 l6 8 h-24 z" fill="#e3b04b"/>
    <path d="M0 -14 L160 -14 L150 6 Q80 14 14 6 Z" fill="#1c0d0a"/><path d="M0 -14 L160 -14 L158 -22 L4 -22 Z" fill="#3a1a1c"/>
  </g>
  <!-- the two dice, thrown: tumbling, lit from the sun side, their arcs behind them -->
  <g fill="none" stroke="#ffe08a" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 10" opacity="0.8"><path d="M150 250 Q210 60 262 98"/><path d="M190 276 Q290 130 330 176"/></g>
  <g transform="translate(266 96) rotate(-18)">
    <path d="M-34 -34 H34 V34 H-34 Z" fill="#f6ead0"/><path d="M34 -34 L46 -24 V44 L34 34 Z" fill="#b89a6a"/><path d="M-34 34 L-22 44 H46 L34 34 Z" fill="#8a6c44"/>
    <g fill="#a3262f"><circle cx="-16" cy="-16" r="6"/><circle cx="16" cy="-16" r="6"/><circle cx="-16" cy="0" r="6"/><circle cx="16" cy="0" r="6"/><circle cx="-16" cy="16" r="6"/><circle cx="16" cy="16" r="6"/></g>
  </g>
  <g transform="translate(332 180) rotate(22)">
    <path d="M-28 -28 H28 V28 H-28 Z" fill="#f6ead0"/><path d="M28 -28 L38 -20 V36 L28 28 Z" fill="#b89a6a"/><path d="M-28 28 L-18 36 H38 L28 28 Z" fill="#8a6c44"/>
    <g fill="#1c0d0a"><circle cx="-12" cy="-12" r="5"/><circle cx="12" cy="12" r="5"/><circle cx="0" cy="0" r="5"/></g>
  </g>
  <!-- the higher one is the one that counts: a gold ring round the six -->
  <circle cx="270" cy="100" r="62" fill="none" stroke="#e3b04b" stroke-width="4" opacity="0.85"/>
  <!-- near waves in two values -->
  <path d="M0 300 V262 Q50 242 100 260 Q150 278 200 258 Q250 240 300 262 Q350 280 400 256 V300 Z" fill="#4a1c1c"/>
  <path d="M0 300 V282 Q60 266 120 282 Q180 296 240 280 Q300 266 400 284 V300 Z" fill="#1c0d0a"/>
  <path d="M94 258 q10 -12 22 -6 q-8 2 -6 10 z M292 260 q12 -14 24 -4 q-8 2 -8 10 z" fill="#ffe08a"/>
</svg>
