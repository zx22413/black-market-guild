<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <!-- 巨鯨號 (freighter) card art: a blue Dutch fluyt with a tall narrow stern, three masts, the whale on the mainsail and crates on deck; an AI-written flat vector placeholder, see public/art/SOURCES.md. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb0d6" /><stop offset="0.6" stop-color="#9fd4e0" /><stop offset="1" stop-color="#e3f4ee" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb3b3" /><stop offset="1" stop-color="#1f7f88" /></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)" />
  <circle cx="60" cy="40" r="30" fill="#fff8d2" opacity="0.4" /><circle cx="60" cy="40" r="20" fill="#fff8d2" />
  <path d="M290 64 q14 -18 34 -8 q10 -16 30 -6 q20 -4 22 14 z" fill="#ffffff" /><path d="M296 62 q10 -6 22 -2 q14 -8 30 0 q14 -4 28 2 l2 2 h-84 z" fill="#cfe6ee" />
  <rect y="196" width="400" height="104" fill="url(#sea)" />
  <g fill="#e8fbf8" opacity="0.7"><rect x="324" y="204" width="56" height="3" rx="1.5" /><rect x="336" y="212" width="32" height="3" rx="1.5" /></g>
