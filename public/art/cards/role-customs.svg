    <path id="fig" d="M166 58 Q184 44 214 50 L216 62 L208 70 L176 70 L168 66 Z M200 66 L226 70 L220 78 L200 76 Z M178 70 Q176 96 192 102 Q208 98 208 70 Z M192 100 Q168 102 160 114 L156 168 L148 262 L170 262 L172 290 L190 290 L192 262 L202 262 L204 290 L222 290 L224 262 L238 262 L230 168 L228 116 Q218 102 192 100 Z M162 114 L134 146 L142 154 L168 130 Z M224 110 L266 146 L260 156 L224 132 Z"/>
