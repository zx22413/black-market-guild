  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4fb0d6" /><stop offset="0.6" stop-color="#9fd4e0" /><stop offset="1" stop-color="#e3f4ee" />
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3fb3b3" /><stop offset="1" stop-color="#1f7f88" /></linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#sky)" />
  <defs><clipPath id="sail"><path d="M140 40 L302 150 Q260 160 218 170 Q160 120 140 40 Z" /></clipPath></defs>
  <circle cx="330" cy="44" r="30" fill="#fff8d2" opacity="0.4" /><circle cx="330" cy="44" r="20" fill="#fff8d2" />
