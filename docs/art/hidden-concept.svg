<text x="340" y="850" font-size="15" text-anchor="end" fill="#6b5a50">洞裡透出青綠光，白色肋骨橫過</text>
<text x="340" y="870" font-size="15" text-anchor="end" fill="#6b5a50">洞緣有斷板頭，腰帶也斷在這裡</text>
