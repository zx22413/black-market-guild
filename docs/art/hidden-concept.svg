<text x="1744.0" y="1156.7" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#6b5a50">船寬 +1.22</text>
<text x="1744.0" y="1400.1" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#6b5a50">船寬 −1.22</text>
