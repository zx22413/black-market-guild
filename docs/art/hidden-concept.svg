<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 2560" font-family="PingFang TC, Heiti TC, sans-serif">
<!-- 幽靈號設計稿 v2（2026-11-07，風格化鬼船）。圖是 scripts/blender/blockout-hidden.py 的 Blender 粗模正投影算繪，標註由 scripts/blender/compose-sheet.py 依 blockouts/hidden-sheet.json 疊上；引線起點是 3D 零件投影到畫面的真實位置。 -->
<rect width="1800" height="2560" fill="#f5efe2"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#3b2f2a">幽靈號 設計稿 v2：風格化鬼船，Blender 粗模</text>
<text x="40" y="94" font-size="18" fill="#6b5a50">辨識（剪影主特徵，沿用）：下緣鋸齒的破帆＋前桅斷一截往前折。鬼船的味道來自低矮的黑船身、發青綠光的舷窗與破洞、垂下的海草，和一座整個往右後方歪掉的高尾樓。</text>
<text x="40" y="120" font-size="18" fill="#6b5a50">四張圖是同一個 3D 粗模（船空間：船頭 +z、龍骨 y = 0、甲板 DECK = 1.25）的正投影；「破」也有收邊：破洞有斷板端與肋骨、斷桅有木刺與鐵箍。</text>
<rect x="360" y="170" width="770" height="770" rx="10" fill="#fbf7ee" stroke="#e2d6c2"/>
<text x="374" y="200" font-size="20" font-weight="700" fill="#3b2f2a">側面（左舷，船頭朝右）</text>
<line x1="368.0" y1="805.7" x2="1122.0" y2="805.7" stroke="#25878c" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="368.0" y1="738.5" x2="1122.0" y2="738.5" stroke="#a08a7a" stroke-width="2" stroke-dasharray="8 6"/>
<line x1="368.0" y1="349.1" x2="1122.0" y2="349.1" stroke="#c0392b" stroke-width="2" stroke-dasharray="8 6"/>
<image x="360" y="170" width="770" height="770" xlink:href="blockouts/hidden/side.png"/>
<text x="1116.0" y="797.7" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#25878c">吃水線 DRAFT 0.5</text>
<text x="1116.0" y="730.5" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#6b5a50">甲板 DECK 1.25</text>
<text x="1116.0" y="341.1" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#c0392b">選船鏡頭 SHIP_BOX 頂 5.6</text>
<rect x="40" y="990" width="540" height="660" rx="10" fill="#fbf7ee" stroke="#e2d6c2"/>
<text x="54" y="1020" font-size="20" font-weight="700" fill="#3b2f2a">正面（從船頭看）</text>
<image x="40" y="990" width="540" height="660" xlink:href="blockouts/hidden/front.png"/>
<rect x="900" y="990" width="858" height="593" rx="10" fill="#fbf7ee" stroke="#e2d6c2"/>
