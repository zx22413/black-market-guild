<text x="340" y="420" font-size="15" text-anchor="end" fill="#6b5a50">整座往右舷歪 0.3、往後仰 0.28</text>
<text x="340" y="440" font-size="15" text-anchor="end" fill="#6b5a50">角柱、壓頂跟著一起歪：是結構歪了</text>
