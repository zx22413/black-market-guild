<!-- 孤注號設計稿 v2（2026-11-07，地中海 xebec）。圖是 scripts/blender/blockout-gambler.py 的 Blender 粗模正投影算繪，標註由 scripts/blender/compose-sheet.py 依 blockouts/gambler-sheet.json 疊上；引線起點是 3D 零件投影到畫面的真實位置。 -->
<rect width="1800" height="2680" fill="#f5efe2"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#3b2f2a">孤注號 設計稿 v2：地中海 xebec，Blender 粗模</text>
<text x="40" y="94" font-size="18" fill="#6b5a50">辨識（剪影主特徵，沿用）：細長船身上一面超大、偏向右舷的紅白三角帆，帆桁又粗又彎、比船還長，桅杆前傾。xebec 的味道來自金邊長尖喙和往後挑出的船尾平台。</text>
<text x="40" y="120" font-size="18" fill="#6b5a50">四張圖是同一個 3D 粗模（船空間：船頭 +z、龍骨 y = 0、甲板 DECK = 1.25）的正投影；帆、尾旗、骰子在遊戲裡是程式碼畫的，這裡是替身。</text>
