<text x="1116.0" y="680.0" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#25878c">吃水線 DRAFT 0.5（槳葉泡在這裡）</text>
<text x="1116.0" y="627.5" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#6b5a50">甲板 DECK 1.25</text>
<text x="1116.0" y="323.0" font-size="15" text-anchor="end" stroke="#fbf7ee" stroke-width="4" paint-order="stroke" fill="#c0392b">選船鏡頭 SHIP_BOX 頂 5.6</text>
