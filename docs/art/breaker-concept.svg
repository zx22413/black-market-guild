<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 2800" font-family="PingFang TC, Heiti TC, sans-serif">
<!-- 海嘯號設計稿 v2（2026-11-07，17 世紀戰槳帆船 galley）。圖是 scripts/blender/blockout-breaker.py 的 Blender 粗模正投影算繪，標註由 scripts/blender/compose-sheet.py 依 blockouts/breaker-sheet.json 疊上；引線起點是 3D 零件投影到畫面的真實位置。左下的替代配色小圖是同一個粗模加 alt 參數算繪的。 -->
<rect width="1800" height="2800" fill="#f5efe2"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#3b2f2a">海嘯號 設計稿 v2：17 世紀戰槳帆船（galley），Blender 粗模</text>
<text x="40" y="94" font-size="18" fill="#6b5a50">辨識（剪影主特徵，沿用）：兩側各兩排槳（從上方看像梳子）＋船頭一支又大又亮的青銅撞角。船身又長又低，船尾高高捲起，上面是紅金棚頂指揮台。</text>
<text x="40" y="120" font-size="18" fill="#6b5a50">四張圖是同一個 3D 粗模（船空間：船頭 +z、龍骨 y = 0、甲板 DECK = 1.25）的正投影。槳在遊戲裡是程式碼畫、會划，這裡放靜止的替身（槳葉泡在吃水線）。</text>
