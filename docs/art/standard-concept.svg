<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 2560" font-family="PingFang TC, Heiti TC, sans-serif">
<!-- 信天翁號設計稿 v2.1（加粗收邊、修銜接）（2026-11-07，中世紀柯克船 cog）。圖是 scripts/blender/blockout-standard.py 的 Blender 粗模正投影算繪，標註由 scripts/blender/compose-sheet.py 依 blockouts/standard-sheet.json 疊上；引線起點是 3D 零件投影到畫面的真實位置。 -->
<rect width="1800" height="2560" fill="#f5efe2"/>
<text x="40" y="58" font-size="34" font-weight="700" fill="#3b2f2a">信天翁號 設計稿 v2.1：中世紀柯克船（cog），Blender 粗模</text>
<text x="40" y="94" font-size="18" fill="#6b5a50">辨識（剪影主特徵，沿用）：一根桅杆＋一面比船還寬、像展開翅膀的方帆。cog 的味道來自短胖的澡盆船身、直挺的斜船首柱與船尾柱，和船頭船尾兩座有城垛的城樓。</text>
<text x="40" y="120" font-size="18" fill="#6b5a50">四張圖是同一個 3D 粗模（船空間：船頭 +z、龍骨 y = 0、甲板 DECK = 1.25）的正投影，零件都在同一個立體空間裡；粗模確認後直接細修成正式模型。</text>
