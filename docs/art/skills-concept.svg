<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1800 2050" width="1800" height="2050" font-family="'PingFang TC','Noto Sans TC',sans-serif">
  <rect width="1800" height="2050" fill="#efe6d2"/>
  <text x="60" y="64" font-size="38" font-weight="700" fill="#3a2a1a">V0.8 原型的五個船技能｜Blender 粗模設計稿（2026-11-17，方向已確認，細修中）</text>
  <text x="60" y="102" font-size="21" fill="#6a5238">實驗，不是規則。開了技能，船的模型本身會變：結構加大、多一個零件、換配色（不是標記）；粗模只定方向，確認後才細修、做進船的模型。</text>
  <g font-size="26" font-weight="700" fill="#3a2a1a" text-anchor="middle">
    <text x="180" y="160">信天翁號・好兆頭</text><text x="540" y="160">孤注號・加注</text><text x="900" y="160">巨鯨號・拾荒</text><text x="1260" y="160">幽靈號・自帶掩護</text><text x="1620" y="160">海嘯號・巨浪</text>
  </g>
  <g font-size="16" fill="#6a5238" text-anchor="middle">
    <text x="180" y="186">結構：船尾城樓加一座紅頂瞭望塔、船首加斜桅帆</text><text x="540" y="186">結構：加第二根桅與一面小三角帆</text><text x="900" y="186">結構：船首加起重架、船尾艙房加一層瞭望艙</text><text x="1260" y="186">結構：歪塔頂長出發光鐘樓與彎尖塔</text><text x="1620" y="186">結構：船首兩側包銅甲、加第二支上撞角</text>
    <text x="180" y="207">零件：塔頂的鍍金信天翁</text><text x="540" y="207">零件：金幣箱與兩舷的金幣盾</text><text x="900" y="207">零件：舷外吊架上的打撈艇</text><text x="1260" y="207">零件：罩住甲板的紫色遮布與暗燈</text><text x="1620" y="207">零件：船首的捲浪雕飾</text>
    <text x="180" y="228">配色：城垛與船舷鍍金、長金旗</text><text x="540" y="228">配色：帆換成紅金條紋、金骰子</text><text x="900" y="228">配色：金腰帶與白飾條</text><text x="1260" y="228">配色：破帆與船舷變紫</text><text x="1620" y="228">配色：槳與棚頂變青綠、白浪紋</text>
  </g>
  <text x="60" y="272" font-size="21" font-weight="700" fill="#3a2a1a">① 你看自己的船（桌面鏡頭，從船尾上方看）— 沒開技能</text>
  <image xlink:href="blockouts/skills/own-off.png" href="blockouts/skills/own-off.png" x="0" y="280" width="1800" height="360"/>
  <text x="60" y="672" font-size="21" font-weight="700" fill="#3a2a1a">② 同一個鏡頭 — 開了技能</text>
  <image xlink:href="blockouts/skills/own-on.png" href="blockouts/skills/own-on.png" x="0" y="680" width="1800" height="360"/>
  <text x="60" y="1072" font-size="21" font-weight="700" fill="#3a2a1a">③ 選船時的側面鏡頭 — 沒開技能</text>
  <image xlink:href="blockouts/skills/side-off.png" href="blockouts/skills/side-off.png" x="0" y="1080" width="1800" height="360"/>
  <text x="60" y="1472" font-size="21" font-weight="700" fill="#3a2a1a">④ 同一個鏡頭 — 開了技能</text>
  <image xlink:href="blockouts/skills/side-on.png" href="blockouts/skills/side-on.png" x="0" y="1480" width="1800" height="360"/>
  <g font-size="19" fill="#3a2a1a">
    <text x="60" y="1886"><tspan font-weight="700">為什麼是這些：</tspan>好兆頭＝船名的那隻鳥當護身符；加注＝賭注本身擺上甲板；拾荒＝撈貨用的小艇；自帶掩護＝把貨遮起來走私；巨浪＝船乘著自己的浪</text>
    <text x="60" y="1920"><tspan font-weight="700">待確認：</tspan>① 結構、零件、配色三層的方向對不對　③ 技能觸發時怎麼動（之後另外提）</text>
    <text x="60" y="1954"><tspan font-weight="700">沿用不變：</tspan>五艘船原本用來辨識的主特徵（方帆、斜三角帆、胖船身、破帆、兩排槳）不動；零件不擋住船上放貨箱的位置</text>
    <text x="60" y="1984" fill="#6a5238">巨鯨號用的是遊戲裡的模型，沒有帆（帆是程式畫的）；其他四艘是當初核准的粗模。</text>
  </g>
</svg>
